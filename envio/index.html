<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completar envío</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="shippingLoader" class="shipping-loader">
    <div class="shipping-spinner"></div>
  </div>

  <main class="container">
    <div class="card">
      <h1>Completar datos de envío</h1>
      <p class="subtitle">
        Ingresá tu información para finalizar el pedido.
      </p>

      <form id="shippingForm">
        <section class="section">
          <h2>Datos personales</h2>

          <div class="grid two-cols">
            <div class="field">
              <label for="firstName">Nombre</label>
              <input type="text" id="firstName" name="firstName" />
              <small class="error" id="error-firstName"></small>
            </div>

            <div class="field">
              <label for="lastName">Apellido</label>
              <input type="text" id="lastName" name="lastName" />
              <small class="error" id="error-lastName"></small>
            </div>

            <div class="field">
              <label for="dni">DNI</label>
              <input type="text" id="dni" name="dni" />
              <small class="error" id="error-dni"></small>
            </div>

            <div class="field">
              <label for="phone">Teléfono</label>
              <input type="text" id="phone" name="phone" />
              <small class="error" id="error-phone"></small>
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Dirección de entrega</h2>

          <div class="grid two-cols">
            <div class="field full">
              <label for="address">Dirección</label>
              <input type="text" id="address" name="address" />
              <small class="error" id="error-address"></small>
            </div>

            <div class="field">
              <label for="apartment">Piso / Depto</label>
              <input type="text" id="apartment" name="apartment" />
            </div>

            <div class="field">
              <label for="city">Ciudad</label>
              <input type="text" id="city" name="city" />
              <small class="error" id="error-city"></small>
            </div>

            <div class="field">
              <label for="province">Provincia</label>
              <input type="text" id="province" name="province" />
              <small class="error" id="error-province"></small>
            </div>

            <div class="field">
              <label for="postalCode">Código postal</label>
              <input type="text" id="postalCode" name="postalCode" />
              <small class="error" id="error-postalCode"></small>
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Dirección de facturación</h2>

          <div class="billing-choice">
            <label class="radio-option">
              <input
                type="radio"
                name="billingOption"
                value="same"
                checked
              />
              <span>Igual a la dirección de entrega</span>
            </label>

            <label class="radio-option">
              <input
                type="radio"
                name="billingOption"
                value="different"
              />
              <span>Elegir otra dirección</span>
            </label>
          </div>

          <div id="billingFields" class="billing-fields hidden">
            <div class="grid two-cols">
              <div class="field full">
                <label for="billingAddress">Dirección de facturación</label>
                <input type="text" id="billingAddress" name="billingAddress" />
              </div>

              <div class="field">
                <label for="billingApartment">Piso / Depto</label>
                <input type="text" id="billingApartment" name="billingApartment" />
              </div>

              <div class="field">
                <label for="billingCity">Ciudad</label>
                <input type="text" id="billingCity" name="billingCity" />
              </div>

              <div class="field">
                <label for="billingProvince">Provincia</label>
                <input type="text" id="billingProvince" name="billingProvince" />
              </div>

              <div class="field">
                <label for="billingPostalCode">Código postal</label>
                <input type="text" id="billingPostalCode" name="billingPostalCode" />
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Observaciones</h2>

          <div class="field">
            <label for="notes">Comentarios adicionales</label>
            <textarea id="notes" name="notes" rows="3"></textarea>
          </div>
        </section>

        <button type="submit" id="submitBtn">Continuar</button>

        <p id="successMessage" class="success hidden">
          Datos enviados correctamente.
        </p>
      </form>
    </div>
  </main>

  <script src="/script.js"></script>
</body>
</html>
