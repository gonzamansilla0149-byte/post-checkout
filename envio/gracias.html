<script>
  const params = new URLSearchParams(window.location.search);
  const rawOrderId = params.get("order_id") || "-";
  const data = JSON.parse(sessionStorage.getItem("shippingSummary") || "{}");

  function cleanOrderId(value) {
    const str = String(value || "-");
    const match = str.match(/Order\/(\d+)/i);
    return match ? match[1] : str.split("/").pop();
  }

  function formatDateTime() {
    const now = new Date();

    return {
      date: now.toLocaleDateString("es-AR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }),
      time: now.toLocaleTimeString("es-AR", {
        hour: "2-digit",
        minute: "2-digit"
      })
    };
  }

  const purchaseDateTime = formatDateTime();

  const orderId = cleanOrderId(rawOrderId);

  const fullName = [data.firstName, data.lastName].filter(Boolean).join(" ");

  const shippingAddress = [
    data.address1,
    data.address2,
    data.city,
    data.province,
    data.zip,
    data.country
  ].filter(Boolean).join(", ");

  const billingAddress =
    data.billingOption === "different"
      ? [
          data.billingAddress,
          data.billingApartment,
          data.billingCity,
          data.billingProvince,
          data.billingPostalCode
        ].filter(Boolean).join(", ")
      : "Igual a la dirección de envío";

  const rows = [
    ["Código de compra", orderId],
    ["Fecha de compra", purchaseDateTime.date],
    ["Hora de compra", purchaseDateTime.time],

    ["Nombre completo", fullName],
    ["DNI", data.dni],
    ["Teléfono", data.phone],

    ["Dirección de envío", shippingAddress],

    ["Dirección de facturación", billingAddress],

    ["Notas", data.notes],
  ];

  document.getElementById("summaryContent").innerHTML = rows
    .filter(([_, value]) => value && value !== "-")
    .map(([label, value]) => `
      <div class="summary-row">
        <strong>${label}</strong>
        <span>${String(value)}</span>
      </div>
    `)
    .join("");

  function downloadPDF() {
    window.print();
  }

  function goHome() {
    window.location.href = "https://dangotools.com";
  }
</script>
