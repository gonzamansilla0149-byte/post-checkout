<script>
document.addEventListener("DOMContentLoaded", function () {
  const summaryEl = document.getElementById("summaryContent");
  if (!summaryEl) return;

  const params = new URLSearchParams(window.location.search);
  const rawOrderId = params.get("order_id") || "-";

  let data = {};
  try {
    data = JSON.parse(sessionStorage.getItem("shippingSummary") || "{}");
  } catch (e) {
    data = {};
  }

  function cleanOrderId(value) {
    const str = String(value || "-");
    const match = str.match(/Order\/(\d+)/i);
    return match ? match[1] : str.split("/").pop();
  }

  const now = new Date();

  const orderId = cleanOrderId(rawOrderId);
  const fullName = [data.firstName, data.lastName].filter(Boolean).join(" ");

  const shippingAddress = [
    data.address1,
    data.address2,
    data.city,
    data.province,
    data.zip,
    data.country
  ].filter(Boolean).join(", ");

  const billingAddress =
    data.billingOption === "different"
      ? [
          data.billingAddress,
          data.billingApartment,
          data.billingCity,
          data.billingProvince,
          data.billingPostalCode
        ].filter(Boolean).join(", ")
      : "Igual a la dirección de envío";

  const rows = [
    ["Código de compra", orderId],
    ["Fecha", now.toLocaleDateString("es-AR")],
    ["Hora", now.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })],
    ["Nombre completo", fullName],
    ["DNI", data.dni],
    ["Teléfono", data.phone],
    ["Dirección de envío", shippingAddress],
    ["Dirección de facturación", billingAddress],
    ["Notas", data.notes],
  ];

  summaryEl.innerHTML = rows
    .filter(([_, value]) => value && value !== "-")
    .map(([label, value]) => `
      <div class="summary-row">
        <strong>${label}</strong>
        <span>${String(value)}</span>
      </div>
    `)
    .join("");
});

function downloadPDF() {
  window.print();
}

function goHome() {
  window.location.href = "https://dangotools.com";
}
</script>
