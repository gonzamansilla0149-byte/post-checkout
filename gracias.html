<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gracias por tu compra</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <div class="card center">
      <div class="icon">✓</div>

      <h1>¡Gracias por tu compra!</h1>
      <p class="subtitle">
        Recibimos correctamente tus datos de envío.
      </p>

      <p class="info">
        En breve vas a recibir un email con el detalle de tu pedido.
      </p>

      <p class="info small">
        Si tenés alguna duda podés contactarnos respondiendo ese email.
      </p>

      <button onclick="goHome()">Volver al inicio</button>
    </div>
  </main>

  <script>
    function goHome() {
      window.location.href = "/";
    }
  </script>
</body>
</html>
